[project]
name = "api2tf"
version = "0.1.0"
description = "Generate complete Terraform providers from OpenAPI specs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Eran Bibi" },
    { name = "Firefly.ai", email = "opensource@firefly.ai" },
]
keywords = ["terraform", "openapi", "provider", "code-generation", "infrastructure-as-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "jsonschema>=4.26.0",
    "deepdiff>=7.0",
]

[project.optional-dependencies]
smart = [
    "anthropic>=0.40.0",
]
test = [
    "pytest>=8.0",
    "pytest-subprocess",
]

[project.urls]
Homepage = "https://github.com/gofireflyio/api2tf"
Repository = "https://github.com/gofireflyio/api2tf"
Issues = "https://github.com/gofireflyio/api2tf/issues"
Changelog = "https://github.com/gofireflyio/api2tf/releases"

[project.scripts]
api2tf = "api2tf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api2tf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker (deselect with '-m not integration')",
]
