[project]
name = "api2tf"
version = "0.1.0"
description = "Generate complete Terraform providers from OpenAPI specs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "jsonschema>=4.0",
    "deepdiff>=7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-subprocess",
]

[project.scripts]
api2tf = "api2tf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api2tf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
